name: Hosted images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  publish:
    name: Publish hosted images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        name: Resolve image tags
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          control_plane="$REGISTRY/t3-control-plane"
          workspace="$REGISTRY/t3-hosted-workspace"
          {
            echo "control_plane_sha=$control_plane:sha-${SHA::12}"
            echo "workspace_sha=$workspace:sha-${SHA::12}"
            if [[ "$REF_TYPE" == tag ]]; then
              version=${REF_NAME#v}
              echo "control_plane_release=$control_plane:$version"
              echo "workspace_release=$workspace:$version"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish control plane
        env:
          SHA_TAG: ${{ steps.tags.outputs.control_plane_sha }}
          RELEASE_TAG: ${{ steps.tags.outputs.control_plane_release }}
        run: |
          set -euo pipefail
          tags=(-t "$SHA_TAG")
          [[ -n "$RELEASE_TAG" ]] && tags+=(-t "$RELEASE_TAG")
          docker buildx build --platform linux/amd64 --push \
            -f apps/control-plane/Dockerfile "${tags[@]}" .

      - name: Build and publish hosted workspace
        env:
          SHA_TAG: ${{ steps.tags.outputs.workspace_sha }}
          RELEASE_TAG: ${{ steps.tags.outputs.workspace_release }}
        run: |
          set -euo pipefail
          tags=(-t "$SHA_TAG")
          [[ -n "$RELEASE_TAG" ]] && tags+=(-t "$RELEASE_TAG")
          docker buildx build --platform linux/amd64 --push \
            -f apps/server/Dockerfile.hosted "${tags[@]}" .
