name: Publish GHCR images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-images-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: t3-control-plane
            dockerfile: apps/control-plane/Dockerfile
          - image: t3-hosted-web
            dockerfile: apps/control-plane/Dockerfile.web
          - image: t3-hosted-workspace
            dockerfile: apps/server/Dockerfile.hosted
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        name: Resolve image tags
        env:
          SOURCE_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          branch=$(printf '%s' "$SOURCE_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^[._-]+##; s#[._-]+$##')
          branch=${branch:-branch}
          branch=${branch:0:112}
          sha=$(git rev-parse --short=12 HEAD)
          image="ghcr.io/$owner/${{ matrix.image }}"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$sha"
            echo "$image:branch-$branch"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
