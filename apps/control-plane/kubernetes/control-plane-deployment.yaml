apiVersion: v1
kind: ConfigMap
metadata:
  name: t3-hosted-control-plane-workspace-catalog
  namespace: t3codes-hosted
data:
  catalog.json: |
    {
      "imageProfiles": [{
        "id": "stable",
        "revision": "hosted-20260812114744-workspace",
        "t3Image": "docker.io/hackslashx/t3codes@sha256:b426e7bff90f367eab02dc25666e784406b1632c26233e99bcbb84338480727e",
        "codeServerImage": "ghcr.io/coder/code-server@sha256:3623e6362abdec6258472882b06fdeec9d6ce2ad3fda316b3c5d7ed092b89add"
      }],
      "egressProfiles": ["restricted"],
      "storageClasses": [{
        "name": "longhorn-ssd-orion",
        "isDefault": true,
        "allowExpansion": true,
        "bindingMode": "Immediate",
        "allowedAccessModes": ["ReadWriteOnce"],
        "minimumBytes": 1073741824,
        "maximumBytes": 1099511627776
      }],
      "gpuClasses": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-hosted-control-plane
  namespace: t3codes-hosted
  labels:
    app.kubernetes.io/name: t3-hosted-control-plane
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: t3-hosted-control-plane
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3-hosted-control-plane
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: t3-hosted-control-plane
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: docker.io/hackslashx/t3codes@sha256:c1ec4ca6aaa9dc6ee748876e0b8e06df971598dbc53ba4ee395735263d4c2d7e
          imagePullPolicy: IfNotPresent
          args: [start]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: T3CODE_CONTROL_PLANE_PORT
              value: "3000"
            - name: T3CODE_CONTROL_PLANE_DATABASE_URL_FILE
              value: /var/run/t3-control-plane-secrets/database-url
            - name: T3CODE_CONTROL_PLANE_OIDC_ISSUER
              value: https://idp.example.test
            - name: T3CODE_CONTROL_PLANE_OIDC_CLIENT_ID
              value: t3-hosted-control-plane
            - name: T3CODE_CONTROL_PLANE_OIDC_CLIENT_SECRET_FILE
              value: /var/run/t3-control-plane-secrets/oidc-client-secret
            - name: T3CODE_CONTROL_PLANE_OIDC_TRANSACTION_KEY_FILE
              value: /var/run/t3-control-plane-secrets/oidc-transaction-key
            - name: T3CODE_CONTROL_PLANE_PUBLIC_BASE_URL
              value: https://t3.example.test
            - name: T3CODE_CONTROL_PLANE_WORKSPACE_CATALOG_FILE
              value: /etc/t3-control-plane/catalog.json
            - name: T3CODE_WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: T3CODE_HOSTED_WORKSPACE_ISSUER
              value: https://t3.example.test
            - name: T3CODE_HOSTED_ASSERTION_ISSUER
              value: https://t3.example.test
            - name: T3CODE_HOSTED_ASSERTION_KEY_ID
              value: hosted-key-1
            - name: T3CODE_HOSTED_ASSERTION_PRIVATE_KEY_FILE
              value: /var/run/t3-control-plane-secrets/hosted-assertion-private-key
            - name: T3CODE_HOSTED_WORKSPACE_PUBLIC_KEYS_CONFIG_MAP
              value: t3-hosted-auth-public-keys
            - name: T3CODE_WORKSPACE_PROXY_SESSION_KEY_FILE
              value: /var/run/t3-control-plane-secrets/workspace-proxy-session-key
            - name: T3CODE_WORKSPACE_PROXY_HOST_SUFFIX
              value: workspaces.example.test
            - name: T3CODE_WORKSPACE_PROXY_COOKIE_DOMAIN
              value: .example.test
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: secrets
              mountPath: /var/run/t3-control-plane-secrets
              readOnly: true
            - name: workspace-catalog
              mountPath: /etc/t3-control-plane
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: t3-hosted-control-plane-database
                  items:
                    - key: url
                      path: database-url
              - secret:
                  name: t3-hosted-control-plane-oidc
                  items:
                    - key: client-secret
                      path: oidc-client-secret
                    - key: transaction-key
                      path: oidc-transaction-key
              - secret:
                  name: t3-hosted-control-plane-assertion-signing
                  items:
                    - key: private-key.pem
                      path: hosted-assertion-private-key
              - secret:
                  name: t3-workspace-proxy-session
                  items:
                    - key: key
                      path: workspace-proxy-session-key
        - name: workspace-catalog
          configMap:
            name: t3-hosted-control-plane-workspace-catalog
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: t3-hosted-control-plane
  namespace: t3codes-hosted
spec:
  selector:
    app.kubernetes.io/name: t3-hosted-control-plane
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
