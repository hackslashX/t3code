apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-workspace-proxy
  namespace: t3codes-hosted
  labels:
    app.kubernetes.io/name: t3-workspace-proxy
    app.kubernetes.io/component: workspace-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: t3-workspace-proxy
      app.kubernetes.io/component: workspace-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3-workspace-proxy
        app.kubernetes.io/component: workspace-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: docker.io/hackslashx/t3codes:hosted-control-plane-test
          imagePullPolicy: IfNotPresent
          args: [proxy]
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: T3CODE_WORKSPACE_PROXY_PORT
              value: "3002"
            - name: T3CODE_WORKSPACE_PROXY_BIND_HOST
              value: 0.0.0.0
            - name: T3CODE_WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: T3CODE_WORKSPACE_PROXY_HOST_SUFFIX
              value: workspaces.example.test
            - name: T3CODE_WORKSPACE_PROXY_SESSION_KEY_FILE
              value: /var/run/t3-workspace-proxy/session-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: session-key
              mountPath: /var/run/t3-workspace-proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: session-key
          secret:
            secretName: t3-workspace-proxy-session
            items:
              - key: key
                path: session-key
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: t3-workspace-proxy
  namespace: t3codes-hosted
spec:
  selector:
    app.kubernetes.io/name: t3-workspace-proxy
    app.kubernetes.io/component: workspace-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: t3-workspace-proxy
  namespace: t3codes-hosted
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: t3-workspace-proxy
      app.kubernetes.io/component: workspace-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3002
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: t3-workspace
              app.kubernetes.io/component: workspace
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
