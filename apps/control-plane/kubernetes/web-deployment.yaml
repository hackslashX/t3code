apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-hosted-web
  namespace: t3codes-hosted
  labels:
    app.kubernetes.io/name: t3-hosted-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: t3-hosted-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3-hosted-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/hackslashx/t3codes@sha256:ab4700d92e4b528f47ea987a7f5fd1d74a58751c83929657e753a7b05cc982da
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: t3-hosted-web
  namespace: t3codes-hosted
spec:
  selector:
    app.kubernetes.io/name: t3-hosted-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: t3-hosted-web
  namespace: t3codes-hosted
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: t3-hosted-web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  egress: []
