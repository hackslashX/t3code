apiVersion: v1
kind: Pod
metadata:
  name: phase0-persistence-reader
  namespace: t3codes-testing
  labels:
    hosted.t3.codes/spike: phase-0
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: busybox:1.36.1
      command: ["sh", "-c"]
      args:
        - test "$(cat /workspace/probe)" = t3codes-phase0-persistence
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: phase0-persistence
